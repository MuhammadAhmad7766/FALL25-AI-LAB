<!DOCTYPE html>
<html>
<head>
    <title>API Integration</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .post { border-bottom: 1px solid #ddd; padding: 10px 0; }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <h1>Latest Posts from API</h1>
    
    {% for post in posts %}
    <div class="post">
        <h3>{{ post.title|capitalize }}</h3>
        <p>{{ post.body }}</p>
    </div>
    {% endfor %}

    {% if not posts %}
        <p>Could not load data. Please try again later.</p>
    {% endif %}
</body>
</html>
